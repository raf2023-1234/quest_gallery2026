const descriptions=[
'梵谷以藍色夜空與河面燈影，呈現亞爾隆河畔的星光。',
'莫內以鬆動筆觸描繪勒阿弗爾港的日出；畫名成為印象派名稱的來源。',
'竇加長期觀察芭蕾舞者的排練、姿態與舞台後方的生活。',
'竇加以舞台視角、燈光與動作瞬間捕捉舞者的姿態。',
'梵谷以強烈的黃色與厚重筆觸，描繪充滿生命力的向日葵。',
'梵谷運用黃與藍的對比，描繪夜晚露天咖啡館的溫暖光芒。',

function makeTextTexture(lines){const c=document.createElement('canvas');c.width=1024;c.height=512;const x=c.getContext('2d');x.fillStyle='#f7f2e9';x.fillRect(0,0,1024,512);x.fillStyle='#302b27';x.textAlign='center';x.font='bold 55px sans-serif';x.fillText(lines[0],512,95);x.font='36px sans-serif';x.fillText(lines[1],512,162);x.font='32px sans-serif';const words=[...lines[2]];let row='',y=242;for(const ch of words){if(x.measureText(row+ch).width>880){x.fillText(row,512,y);y+=53;row=''}row+=ch}if(row)x.fillText(row,512,y);x.fillStyle='#886b3c';x.font='30px sans-serif';x.fillText('按扳機或滑鼠點選關閉  ·  CLOSE',512,455);const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t}
function closeDetail(){if(!detailPanel)return;scene.remove(detailPanel);detailPanel.traverse(o=>{if(o.geometry)o.geometry.dispose();if(o.material&&o.material.userData?.detailText){o.material.map.dispose();o.material.dispose()}});detailPanel=null;activeExhibit=null}
function showDetail(i){if(activeExhibit===i){closeDetail();return}closeDetail();activeExhibit=i;const e=exhibits[i];const g=new THREE.Group();detailPanel=g;scene.add(g);const head=new THREE.Vector3();camera.getWorldPosition(head);const facing=new THREE.Vector3();camera.getWorldDirection(facing);facing.y=0;if(facing.lengthSq()<.01)facing.set(0,0,-1);facing.normalize();g.position.copy(head).addScaledVector(facing,2.25);g.position.y=head.y-.08;g.lookAt(head.x,g.position.y,head.z);const bg=new THREE.Mesh(new THREE.PlaneGeometry(3.6,2.5),new THREE.MeshBasicMaterial({color:0x191b20,side:THREE.DoubleSide,depthTest:false}));bg.renderOrder=20;g.add(bg);const art=clickable.find(o=>o.userData.exhibitIndex===i&&o.geometry.parameters.width===2.35);if(art?.material.map){const img=art.material.map.image;const ratio=img.width/img.height;const w=Math.min(1.75,2.15*ratio),h=w/ratio;const mesh=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({map:art.material.map,side:THREE.DoubleSide,depthTest:false,toneMapped:false}));mesh.position.set(-.86,0,.02);mesh.renderOrder=21;g.add(mesh)}const tx=makeTextTexture([e.name,e.artist+' · '+e.year,descriptions[i]]);const m=new THREE.MeshBasicMaterial({map:tx,side:THREE.DoubleSide,transparent:false,depthTest:false});m.userData.detailText=true;const info=new THREE.Mesh(new THREE.PlaneGeometry(1.65,1.0),m);info.position.set(.87,0,.025);info.renderOrder=22;g.add(info)}
const controllers=[renderer.xr.getController(0),renderer.xr.getController(1)];const raycaster=new THREE.Raycaster();const tempMatrix=new THREE.Matrix4();const rays=[];
function setRayFromController(ctrl){ctrl.updateWorldMatrix(true,false);tempMatrix.identity().extractRotation(ctrl.matrixWorld);raycaster.ray.origin.setFromMatrixPosition(ctrl.matrixWorld);raycaster.ray.direction.set(0,0,-1).applyMatrix4(tempMatrix).normalize()}
function trigger(ctrl){setRayFromController(ctrl);if(detailPanel){closeDetail();return}const intersections=raycaster.intersectObjects(clickable,false);if(intersections.length){showDetail(intersections[0].object.userData.exhibitIndex);return}/* 地板瞬移暫時停用，避免與搖桿/扳機輸入衝突。 */ }
controllers.forEach((ctrl,index)=>{rig.add(ctrl);const line=new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,0),new THREE.Vector3(0,0,-6)]),new THREE.LineBasicMaterial({color:0xc8aa6b,transparent:true,opacity:.75}));ctrl.add(line);line.visible=false;ctrl.addEventListener('connected',event=>{line.visible=event.data?.handedness==='right'});ctrl.addEventListener('disconnected',()=>{line.visible=false});rays.push(line);ctrl.addEventListener('selectstart',(event)=>{if(event.data?.handedness==='right')trigger(ctrl)})});

// 僅保留右手搖桿轉向；不讀取左手搖桿，也不監聽左手按鍵。
const clock=new THREE.Clock();let turnLatch=false;
function readRightStick(gp){
 if(!gp)return 0;
 const a=gp.axes||[];
 return Number(a.length>=4?a[2]:a[0])||0;
}
function loop(){
 const dt=Math.min(clock.getDelta(),.04);
 if(!renderer.xr.isPresenting){
   const speed=(keys.ShiftLeft?5.5:2.6)*dt;
   let mx=(keys.KeyD?1:0)-(keys.KeyA?1:0),mz=(keys.KeyS?1:0)-(keys.KeyW?1:0);
   if(mx||mz){let len=Math.hypot(mx,mz);mx/=len;mz/=len;rig.position.x+=(mx*Math.cos(yaw)+mz*Math.sin(yaw))*speed;rig.position.z+=(-mx*Math.sin(yaw)+mz*Math.cos(yaw))*speed}

 }else{
   const session=renderer.xr.getSession();let turn=0;
   if(session){for(const source of session.inputSources){
     if(source.handedness==='right')turn=readRightStick(source.gamepad);
   }}
   if(Math.abs(turn)>.72&&!turnLatch){rig.rotation.y-=Math.sign(turn)*Math.PI/6;turnLatch=true}
   else if(Math.abs(turn)<.28)turnLatch=false;

 }

}
